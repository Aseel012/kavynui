name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (unused code, hook rules)
        run: npm run lint
      - name: Typecheck (TypeScript components)
        run: npm run typecheck
      - name: Static checks (catalog, stray files, CSP)
        run: node scripts/check.mjs
      - name: Unit tests (catalog, search, colors, contrast, backgrounds, upload components)
        run: npm test
      - name: Build
        run: npm run build
      - name: Serve build
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &
          npx --yes wait-on http://127.0.0.1:4173 --timeout 30000
      - name: Registry check (shadcn schema, byte-identical sources)
        run: npm run registry:verify
      - name: Install every component into fresh TypeScript and JavaScript apps
        run: |
          npm run test:install
          JS=1 npm run test:install
      - name: End-to-end tests
        env:
          BASE: http://127.0.0.1:4173
        run: npm run e2e
      - name: Regression smoke, every route (dark, light, mobile)
        env:
          BASE: http://127.0.0.1:4173
        run: |
          node scripts/smoke.mjs
          LIGHT=1 node scripts/smoke.mjs
          MOBILE=1 node scripts/smoke.mjs
